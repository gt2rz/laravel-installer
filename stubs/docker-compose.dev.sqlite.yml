services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    image: {{PROJECT_NAME}}:dev
    environment:
      APP_ENV: local
      APP_DEBUG: true
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:8000}
      OCTANE_SERVER: {{OCTANE_SERVER}}
      DB_CONNECTION: sqlite
      CACHE_STORE: database
      SESSION_DRIVER: file
      QUEUE_CONNECTION: database
    volumes:
      - .:/app
      - /app/vendor
    ports:
      - "${APP_PORT:-8000}:8000"
    command: "{{APP_DEV_CMD}}"
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge
